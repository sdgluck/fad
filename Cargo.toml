[package]
name = "fad"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find and destroy: a terminal UI for finding what is using your disk and deleting it"
license = "MIT"
repository = "https://github.com/sdgluck/fad"
readme = "README.md"
keywords = ["disk", "du", "tui", "cleanup", "storage"]
categories = ["command-line-utilities", "filesystem"]
exclude = [".github/", ".claude/"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
crossbeam-channel = "0.5.16"
libc = "0.2.189"
nucleo-matcher = "0.3.1"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[dev-dependencies]
# The age tests backdate files with `utimes`; one call is not worth a crate.
libc = "0.2.189"
tempfile = "3.27.0"

# The Objective-C bridge is only reachable from the macOS trash implementation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
    "NSFileManager",
    "NSURL",
    "NSString",
    "NSError",
    "NSObject",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
